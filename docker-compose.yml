
services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-afisha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-afisha}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-afisha}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  bot:
    build: ./backend
    command: python -m app.bot.bot
    restart: unless-stopped
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://afisha:1221@db:5432/afisha
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - LLM_PROVIDER=${LLM_PROVIDER}
      - YANDEXGPT_API_KEY=${YANDEXGPT_API_KEY}
      - YANDEXGPT_FOLDER_ID=${YANDEXGPT_FOLDER_ID}
      - YANDEXGPT_BASE_URL=${YANDEXGPT_BASE_URL}
      - YANDEXGPT_MODEL=${YANDEXGPT_MODEL}
      - SITE_URL=${SITE_URL:-http://localhost:3000}
    depends_on:
      - db
      - api

volumes:
  postgres_data: